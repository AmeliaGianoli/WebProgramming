<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <title>Document</title>
</head>

<body>
  <!-- solid style -->
  <i class="fa-solid fa-user" style="font-size: 50px; color:green"></i>
  <br>
  <!-- regular style -->
  <i class="fa-regular fa-user"></i>
  <br>
  <!-- light style -->
  <i class="fa-light fa-user"></i>
  <br>
  <!-- thin style -->
  <i class="fa-thin fa-user"></i>
  <br>
  <!-- duotone style -->
  <i class="fa-duotone fa-solid fa-user"></i>
  <br>
  <!-- sharp solid style -->
  <i class="fa-sharp fa-solid fa-user"></i>
  <br>
  <!-- sharp regular style -->
  <i class="fa-sharp fa-regular fa-user"></i>
  <br>
  <!-- sharp light style -->
  <i class="fa-sharp fa-light fa-user"></i>
  <br>
  <!-- sharp thin style -->
  <i class="fa-sharp fa-thin fa-user"></i>
  <br>
  <!-- all new sharp duotone style -->
  <i class="fa-sharp-duotone fa-solid fa-user"></i>
  <br>
  <!--brand icon-->
  <i class="fa-brands fa-github-square"></i>
  <br>
  <div class="fa-3x">
    <i class="fa-solid fa-circle-plus fa-beat"></i>
    <i class="fa-solid fa-heart fa-beat"></i>
    <i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 0.5s;"></i>
    <i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 2s;"></i>
    <i class="fa-solid fa-heart fa-beat" style="--fa-beat-scale: 2.0;"></i>
  </div>
</body>

</html>
